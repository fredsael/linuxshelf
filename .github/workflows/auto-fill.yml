name: Auto-fill metadata

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pull missing metadata from Repology
        run: npm run auto-fill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open pull request with updated metadata
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: auto-fill program metadata from Repology and GitHub"
          title: "chore: auto-fill program metadata from Repology and GitHub"
          body: |
            Weekly automated update of blank program metadata (`version`,
            `license`, `latest_release`, `packages`) from the Repology API,
            plus incremental refresh of `releases` timelines from each
            program's GitHub repository.

            Hand-written fields are never overwritten.
          branch: chore/auto-fill-metadata
          delete-branch: true
