description:
  short: A fast, actively maintained system information tool in C, the modern successor to neofetch.
  full: |
    ## What is it?

    Fastfetch prints a summary of your system — distribution, kernel, shell,
    desktop, CPU, GPU, memory, and more — alongside your distribution's
    ASCII logo. It is written in C and focused on speed and correctness,
    replacing the archived neofetch with active development and far better
    performance.

    ## Why use it?

    Fastfetch is the first command many people run on a new system, and a
    favourite for screenshots and dotfile showcases. It starts in
    milliseconds, supports hundreds of modules and logos, and is
    configurable through JSONC files. Because it is actively maintained,
    new hardware and distributions are detected correctly rather than
    showing up as "unknown".

    ## Key features

    - Extremely fast startup and low overhead
    - 50+ information modules, from battery to GPU
    - Built-in logos for distributions, plus custom ASCII art
    - JSONC configuration with preset support
    - Shell, terminal, and font detection
    - Package counts for many package managers

    ## How it compares

    Against neofetch, Fastfetch is faster, actively maintained, and more
    accurate; neofetch is archived and unmaintained. Against htop, btop,
    and glances it is not a live monitor — it takes a snapshot. It
    complements them nicely: Fastfetch to show off the system, a real
    monitor to watch it work.
